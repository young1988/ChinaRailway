<svg viewBox="0 0 680 400" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>铁路足迹 技术架构</title>
  <desc>前端四层架构 Core/Net/MapAdapter/Store/App 与 Stations、Patches 模块及数据流向</desc>
  <rect x="0" y="0" width="680" height="400" fill="#0C1322"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7E8DA6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">铁路足迹 · 前端技术架构</text>
  <text x="110" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#A9D8C8">原始铁路数据</text>
  <g font-family="sans-serif">
    <g><rect x="200" y="58" width="320" height="40" rx="10" fill="#1B2C4A" stroke="#3A5A8C" stroke-width="0.5"/><text x="360" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF5">App · 交互与面板</text><text x="360" y="92" text-anchor="middle" font-size="11" fill="#9FB0C8">用户输入 · 行程编辑 · 设置</text></g>
    <g><rect x="200" y="116" width="320" height="40" rx="10" fill="#1B2C4A" stroke="#3A5A8C" stroke-width="0.5"/><text x="360" y="134" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF5">Store · 存档与迁移</text><text x="360" y="150" text-anchor="middle" font-size="11" fill="#9FB0C8">只存意图 · 加载回填 · VER 迁移</text></g>
    <g><rect x="200" y="174" width="320" height="40" rx="10" fill="#1B2C4A" stroke="#3A5A8C" stroke-width="0.5"/><text x="360" y="192" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF5">MapAdapter · 地图适配</text><text x="360" y="208" text-anchor="middle" font-size="11" fill="#9FB0C8">图层 · 迷雾 · 多底图 · 铁路专注</text></g>
    <g><rect x="200" y="232" width="320" height="40" rx="10" fill="#1B2C4A" stroke="#3A5A8C" stroke-width="0.5"/><text x="360" y="250" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF5">Net · 路网构建</text><text x="360" y="266" text-anchor="middle" font-size="11" fill="#9FB0C8">线路合并 · 缺口搭桥(≤6km)</text></g>
    <g><rect x="200" y="290" width="320" height="40" rx="10" fill="#1B2C4A" stroke="#3A5A8C" stroke-width="0.5"/><text x="360" y="308" text-anchor="middle" font-size="14" font-weight="500" fill="#E6EDF5">Core · 核心几何</text><text x="360" y="324" text-anchor="middle" font-size="11" fill="#9FB0C8">Catmull-Rom 贝塞尔 · 脉冲动画</text></g>
    <g><rect x="40" y="210" width="140" height="56" rx="10" fill="#143A33" stroke="#1D9E75" stroke-width="0.5"/><text x="110" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#E6EDF5">Stations</text><text x="110" y="250" text-anchor="middle" font-size="11" fill="#A9D8C8">稳定车站ID(OSM)</text><text x="110" y="263" text-anchor="middle" font-size="11" fill="#A9D8C8">别名解析</text></g>
    <g><rect x="500" y="210" width="140" height="56" rx="10" fill="#3A2E14" stroke="#EF9F27" stroke-width="0.5"/><text x="570" y="232" text-anchor="middle" font-size="13" font-weight="500" fill="#E6EDF5">Patches</text><text x="570" y="250" text-anchor="middle" font-size="11" fill="#E7CF9E">补丁 · 线路维护</text><text x="570" y="263" text-anchor="middle" font-size="11" fill="#E7CF9E">connect/replace</text></g>
    <g stroke="#7E8DA6" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
      <line x1="170" y1="288" x2="170" y2="274"/>
      <line x1="170" y1="230" x2="170" y2="216"/>
      <line x1="170" y1="172" x2="170" y2="158"/>
      <line x1="170" y1="114" x2="170" y2="100"/>
      <line x1="180" y1="238" x2="200" y2="252"/>
      <line x1="500" y1="238" x2="520" y2="194"/>
    </g>
  </g>
  <text x="340" y="356" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9FB0C8">数据流向：原始铁路数据 → Stations 解析稳定ID → Net 构建路网 → MapAdapter 渲染</text>
  <text x="340" y="376" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9FB0C8">→ 用户行程写入 Store 存档（只存意图，加载时回填路径里程）</text>
</svg>