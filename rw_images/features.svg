<svg viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>铁路足迹 功能清单</title>
  <desc>App 界面示意与七大核心功能标注</desc>
  <rect x="0" y="0" width="680" height="380" fill="#0C1322"/>
  <text x="70" y="56" font-family="sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">界面示意</text>
  <rect x="70" y="70" width="180" height="300" rx="20" fill="#0F1B33" stroke="#2A3A5A" stroke-width="1"/>
  <rect x="80" y="82" width="160" height="276" rx="12" fill="#0A1426"/>
  <g stroke="#15243F" stroke-width="1">
    <line x1="80" y1="140" x2="240" y2="140"/>
    <line x1="80" y1="200" x2="240" y2="200"/>
    <line x1="80" y1="260" x2="240" y2="260"/>
    <line x1="130" y1="82" x2="130" y2="358"/>
    <line x1="190" y1="82" x2="190" y2="358"/>
  </g>
  <polyline points="95,300 130,250 170,280 210,230" fill="none" stroke="#3E5C86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M110,210 Q150,120 200,150" fill="none" stroke="#FF9D4D" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#4FA3FF">
    <circle cx="110" cy="210" r="5"/><circle cx="200" cy="150" r="5"/>
    <circle cx="150" cy="165" r="3"/>
  </g>
  <circle cx="200" cy="150" r="9" fill="none" stroke="#4FA3FF" stroke-width="1.5" opacity="0.5"/>
  <g>
    <rect x="116" y="216" width="34" height="15" rx="3" fill="#0A1426" stroke="#2A3A5A"/>
