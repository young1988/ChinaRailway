    <g><rect x="290" y="272" width="350" height="34" rx="8" fill="#16223C" stroke="#2C3E60" stroke-width="0.5"/><rect x="302" y="280" width="18" height="18" rx="4" fill="#FF9D4D"/><text x="332" y="294">起点终点脉冲高亮</text></g>
