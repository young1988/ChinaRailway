    <rect x="176" y="126" width="34" height="15" rx="3" fill="#0A1426" stroke="#2A3A5A"/>
    <text x="193" y="137" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#9FB0C8">上海</text>
  </g>
  <text x="290" y="56" font-family="sans-serif" font-size="15" font-weight="500" fill="#FFFFFF">核心功能</text>
  <g font-family="sans-serif" font-size="14" fill="#E6EDF5">
    <g><rect x="290" y="72" width="350" height="34" rx="8" fill="#16223C" stroke="#2C3E60" stroke-width="0.5"/><rect x="302" y="80" width="18" height="18" rx="4" fill="#FF9D4D"/><text x="332" y="94">车站高亮（蓝点 + 黑底灰字站名）</text></g>
    <g><rect x="290" y="112" width="350" height="34" rx="8" fill="#16223C" stroke="#2C3E60" stroke-width="0.5"/><rect x="302" y="120" width="18" height="18" rx="4" fill="#FF9D4D"/><text x="332" y="134">贝塞尔曲线行程动画</text></g>
    <g><rect x="290" y="152" width="350" height="34" rx="8" fill="#16223C" stroke="#2C3E60" stroke-width="0.5"/><rect x="302" y="160" width="18" height="18" rx="4" fill="#FF9D4D"/><text x="332" y="174">迷雾地图（压暗未走线路）</text></g>
    <g><rect x="290" y="192" width="350" height="34" rx="8" fill="#16223C" stroke="#2C3E60" stroke-width="0.5"/><rect x="302" y="200" width="18" height="18" rx="4" fill="#FF9D4D"/><text x="332" y="214">多底图切换（正常 / 纯黑 / 卫星）</text></g>
